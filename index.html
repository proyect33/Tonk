    <script type="module">
        // Default API key, can be overridden by user config
        const DEFAULT_TMDB_API_KEY = "1076ac03cba68c1680094495c8506ad7";
        const TMDB_IMAGE_URL = "https://image.tmdb.org/t/p/w300"; // Poster size for cards
        const TMDB_BACKDROP_URL = "https://image.tmdb.org/t/p/w1280"; // Backdrop size for player header
        const LOCAL_STORAGE_KEY = "entretenimientoData";
        const CONFIG_STORAGE_KEY = "entretenimientoConfig";


        let contentData = [
            // Inicial sin series/peliculas y cada elemento además puede tener: servers:[...]
        ];

        let config = {
            tmdbApiKey: DEFAULT_TMDB_API_KEY
        };

        let tmdbDetailsCache = {}; // Guardar detalles extra TMDB por id para evitar peticiones dobles

        let tmdbModalSection = "series";
        let lastPanelMode = 'all'; // para refrescar tras editar/borrar

        // Opciones de card abierta (solo una a la vez)
        let openOptionsMenuId = null;

        // JWPlayer instance
        let jwPlayerInstance = null;


        // Expose functions to global scope for HTML onclick attributes
        window.showContent = showContent;
        window.openTmdbModal = openTmdbModal;
        window.closeTmdbModal = closeTmdbModal;
        window.openEditModal = openEditModal;
        window.closeEditModal = closeEditModal;
        window.saveEditModal = saveEditModal;
        window.openServersModal = openServersModal;
        window.addServerInput = addServerInput;
        window.saveServersModal = saveServersModal;
        window.addTmdbFoundItem = addTmdbFoundItem;
        window.deleteContent = deleteContent;
        window.escapeHTML = escapeHTML; // Helper used by exposed functions
        window.toggleCardOptionsMenu = toggleCardOptionsMenu; // Used by event listeners
        window.closeAllOptionsMenus = closeAllOptionsMenus; // Used by event listeners and other functions
        window.saveConfig = saveConfig; // Expose saveConfig
         window.openPlayerModal = openPlayerModal; // Expose for event delegation
         window.closePlayerModal = closePlayerModal; // Expose
         window.cambiarServidor = cambiarServidor; // Expose for server buttons
         window.showTrailer = showTrailer; // Expose trailer button action
         window.copyShareLink = copyShareLink; // Expose for sharing


        // Load data and config from localStorage
        function loadData() {
            try {
                const storedData = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (storedData) {
                    contentData = JSON.parse(storedData);
                }
            } catch (e) {
                console.error("Error loading data from localStorage:", e);
                contentData = []; // Start fresh if loading fails
            }
        }

        function saveData() {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(contentData));
            } catch (e) {
                console.error("Error saving data to localStorage:", e);
                alert("No se pudo guardar la información. Puede que tu navegador no soporte el almacenamiento local o esté lleno.");
            }
        }

         function loadConfig() {
            try {
                const storedConfig = localStorage.getItem(CONFIG_STORAGE_KEY);
                if (storedConfig) {
                    config = JSON.parse(storedConfig);
                     // Ensure default key is used if saved config is missing tmdbApiKey
                    if (!config.tmdbApiKey) {
                         config.tmdbApiKey = DEFAULT_TMDB_API_KEY;
                    }
                }
            } catch (e) {
                console.error("Error loading config from localStorage:", e);
                config.tmdbApiKey = DEFAULT_TMDB_API_KEY; // Use default if loading fails
            }
         }

         function saveConfig() {
             try {
                const apiKeyInput = document.getElementById('config-tmdb-api-key');
                if (apiKeyInput) {
                    config.tmdbApiKey = apiKeyInput.value.trim() || DEFAULT_TMDB_API_KEY;
                }
                localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify(config));
                 alert("Configuración guardada.");
             } catch (e) {
                 console.error("Error saving config to localStorage:", e);
                 alert("No se pudo guardar la configuración.");
             }
         }


        // Nueva función: obtener detalles completos de TMDB para un ítem dado (movie o serie)
        async function fetchTmdbDetails(tmdb_id, type) {
            if (!tmdb_id) return null;
            let cacheKey = type + "_" + tmdb_id;
            if (tmdbDetailsCache[cacheKey]) return tmdbDetailsCache[cacheKey];

            // Use the current API key from config
            const apiKey = config.tmdbApiKey;
            if (!apiKey || apiKey === DEFAULT_TMDB_API_KEY) {
                 console.warn("Using default TMDB API key. Functionality might be limited.");
            }


            let url;
            if (type === "series") {
                url = `https://api.themoviedb.org/3/tv/${tmdb_id}?api_key=${apiKey}&language=es-ES&append_to_response=videos`; // Append videos for trailers
            } else {
                url = `https://api.themoviedb.org/3/movie/${tmdb_id}?api_key=${apiKey}&language=es-ES&append_to_response=videos`; // Append videos for trailers
            }
            try {
                let resp = await fetch(url);
                if (!resp.ok) {
                    console.error(`TMDB details fetch error: ${resp.status}`, await resp.text());
                    // Handle specific API key errors? For now, just log.
                    throw new Error(`HTTP error! status: ${resp.status}`);
                }
                let data = await resp.json();
                 // Clean up potentially null fields from TMDB
                if (data.overview === null) data.overview = undefined;
                if (data.genres === null) data.genres = undefined;
                if (data.vote_average === null) data.vote_average = undefined;
                 if (data.runtime === null && data.episode_run_time) data.runtime = data.episode_run_time[0]; // For series, use episode runtime
                 if (data.runtime === null) data.runtime = undefined;
                 if (data.spoken_languages === null) data.spoken_languages = undefined;
                 if (data.production_countries === null) data.production_countries = undefined;


                tmdbDetailsCache[cacheKey] = data;
                return data;
            } catch (e) {
                console.error("Error fetching TMDB details:", e);
                return null;
            }
        }

        // Modifica para mostrar detalles enriquecidos al renderizar la card
        function contentCardHTML(item) {
            let cardId = item.id;
            let imgHtml = '';
            if (item.poster_url) {
                imgHtml = `<div class="content-image"><img src="${escapeHTML(item.poster_url)}" alt="${escapeHTML(item.title)}" loading="lazy"></div>`;
            } else {
                imgHtml = `<div class="content-image" style="background: linear-gradient(45deg, #${Math.floor(Math.random()*16777215).toString(16)}, #${Math.floor(Math.random()*16777215).toString(16)});"></div>`;
            }
            // Use item properties, providing defaults or placeholders if undefined
            let overview = item.overview !== undefined ? escapeHTML(item.overview) : (item.tmdb_id ? 'Cargando sinopsis...' : 'Sin sinopsis');
            let genres = item.genres !== undefined ? escapeHTML(item.genres) : '';
            let rating = item.rating !== undefined ? (item.rating ? `★ ${escapeHTML(item.rating)}` : '') : (item.tmdb_id ? 'Cargando...' : ''); // Handle rating display
            let year = item.year !== undefined ? `(${escapeHTML(item.year)})` : '';


            // Opciones
            return `
                <div class="content-card" data-cardid="${cardId}">
                    ${imgHtml}
                    <button class="content-options-btn" title="Opciones" data-cardid="${cardId}">&#8942;</button>
                    <div class="content-options-menu" id="optionsmenu_${cardId}">
                        <button class="content-options-item" onclick="openEditModal('${cardId}')"><i class="fas fa-pencil"></i> Editar datos</button>
                        <button class="content-options-item" onclick="openServersModal('${cardId}')"><i class="fas fa-server"></i> Servidores</button>
                        <button class="content-options-item" onclick="copyShareLink('${cardId}')"><i class="fas fa-share"></i> Compartir</button>
                        <div style="border-top: 1px solid #3a3a3a; margin: 6px 0;"></div>
                        <button class="content-options-item del" onclick="deleteContent('${cardId}')"><i class="fas fa-trash"></i> Eliminar</button>
                    </div>
                    <div class="content-info">
                        <h3 class="content-title">${escapeHTML(item.title)}</h3>
                        <p class="content-type">${item.type === 'movie' ? 'Película' : 'Serie'}</p>
                         ${year ? `<span style="color:#aaa; font-size:13px;">${year}</span>` : ""}
                        <div class="content-extra-info">
                            ${genres ? `<div class="content-genres">${genres}</div>` : ''}
                            <div class="content-overview">${overview}</div>
                            ${rating ? `<div class="content-rating">${rating}</div>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        async function enrichCardDetails() {
             // Use a Set to avoid processing the same item multiple times if re-rendered quickly
            const itemsToEnrich = contentData.filter(item => item.tmdb_id && !item._extraLoaded);

             if (itemsToEnrich.length === 0) return; // No items to enrich

             const apiKey = config.tmdbApiKey;
             if (!apiKey) {
                 console.warn("No TMDB API key available for enrichment.");
                 return; // Cannot enrich without API key
             }

            // Process items in batches or just await all
            const promises = itemsToEnrich.map(async item => {
                let details = await fetchTmdbDetails(item.tmdb_id, item.type);
                if (!details) {
                    item._extraLoaded = true; // Mark even if failed to avoid retrying repeatedly
                    // Update UI placeholders if fetch failed? Maybe not necessary, they'll show 'Cargando...' or empty
                    return;
                }

                // Only update fields that haven't been manually edited (undefined)
                let changed = false;
                if (item.overview === undefined && details.overview !== undefined) { item.overview = (details.overview || "").trim(); changed = true; }
                if (item.genres === undefined && details.genres !== undefined) { item.genres = (details.genres && details.genres.map(g=>g.name).join(", ")) || ""; changed = true; }
                if (item.rating === undefined && details.vote_average !== undefined) { item.rating = details.vote_average ? (details.vote_average.toFixed(1)) : ""; changed = true; }
                if (item.poster_url === undefined && details.poster_path) { item.poster_url = TMDB_IMAGE_URL + details.poster_path; changed = true; }
                if (item.year === undefined && (item.type === 'series' ? details.first_air_date : details.release_date)) {
                    item.year = (item.type === 'series' ? details.first_air_date : details.release_date).substring(0, 4); changed = true;
                }
                 // Add backdrop path for player header background
                 if (item.backdrop_url === undefined && details.backdrop_path) { item.backdrop_url = TMDB_BACKDROP_URL + details.backdrop_path; changed = true; }
                 // Add trailer ID if available
                 if (item.trailer_id === undefined && details.videos && details.videos.results) {
                     const trailer = details.videos.results.find(v => v.site === 'YouTube' && v.type === 'Trailer');
                     if (trailer) { item.trailer_id = trailer.key; changed = true; }
                 }
                 // Add runtime/duration
                 const runtime = details.runtime || (details.episode_run_time ? details.episode_run_time[0] : undefined);
                 if (item.runtime === undefined && runtime !== undefined) { item.runtime = runtime; changed = true; }
                 // Add languages (primary spoken language?) or original language
                 const language = details.spoken_languages && details.spoken_languages.length > 0 ? details.spoken_languages[0].english_name : undefined;
                 if (item.language === undefined && language !== undefined) { item.language = language; changed = true; }
                  // Add production countries
                 const countries = details.production_countries && details.production_countries.length > 0 ? details.production_countries.map(c => c.name).join(", ") : undefined;
                 if (item.countries === undefined && countries !== undefined) { item.countries = countries; changed = true; }


                item._extraLoaded = true; // Mark as enriched attempt

                // Update the DOM elements for the specific card if it's currently visible
                 const cardElement = document.querySelector(`.content-card[data-cardid="${item.id}"]`);
                 if (cardElement && changed) {
                      const overviewEl = cardElement.querySelector('.content-overview');
                      if (overviewEl && item.overview !== undefined) overviewEl.textContent = escapeHTML(item.overview);

                      const genresEl = cardElement.querySelector('.content-genres');
                      if (genresEl && item.genres !== undefined) {
                           genresEl.textContent = escapeHTML(item.genres);
                           genresEl.style.display = item.genres ? '' : 'none'; // Hide if empty
                      }

                      const ratingEl = cardElement.querySelector('.content-rating');
                      if (ratingEl && item.rating !== undefined) {
                           ratingEl.textContent = item.rating ? `★ ${escapeHTML(item.rating)}` : '';
                           ratingEl.style.display = item.rating ? '' : 'none'; // Hide if empty
                      }
                      const yearEl = cardElement.querySelector('.content-type').nextElementSibling; // Find span after type
                      if (yearEl && yearEl.tagName === 'SPAN' && item.year !== undefined) {
                           yearEl.textContent = item.year ? `(${escapeHTML(item.year)})` : '';
                           yearEl.style.display = item.year ? '' : 'none'; // Hide if empty
                      }

                      const posterEl = cardElement.querySelector('.content-image img');
                      if (posterEl && item.poster_url && posterEl.src !== item.poster_url) {
                          posterEl.src = escapeHTML(item.poster_url);
                      } else if (cardElement.querySelector('.content-image') && !item.poster_url) {
                          // If no poster, ensure it falls back to placeholder style
                           cardElement.querySelector('.content-image').style.backgroundImage = ''; // Remove potential old image
                           cardElement.querySelector('.content-image').style.backgroundColor = '';
                           cardElement.querySelector('.content-image').style.backgroundImage = `linear-gradient(45deg, #${Math.floor(Math.random()*16777215).toString(16)}, #${Math.floor(Math.random()*16777215).toString(16)})`;
                           if(posterEl) posterEl.style.display = 'none'; // Hide the img tag
                      }
                 }
            });

            await Promise.all(promises);
             saveData(); // Save data after enrichment batch
        }

        function showContent(type, event) {
            // Actualizar botones activos filtro
            document.querySelectorAll('.filter-button').forEach(btn => btn.classList.remove('active'));
            if (event && event.target.classList.contains('filter-button')) {
                event.target.classList.add('active');
            }

            lastPanelMode = type;

            const panel = document.getElementById('content-panel');
            let html = '';

            if (type === 'all') {
                // Series Section
                const seriesList = contentData.filter(item => item.type === 'series');
                html += `
                    <div class="section-header">Series</div>
                    <button class="add-section-button" onclick="openTmdbModal('series')">Agregar Serie</button>
                    <div class="content-section">
                        ${
                            (seriesList.length === 0)
                            ? `<span class="no-content-message">Sin series</span>`
                            : seriesList.map(item => contentCardHTML(item)).join('')
                        }
                    </div>
                `;
                // Películas Section
                const movieList = contentData.filter(item => item.type === 'movie');
                html += `
                    <div class="section-header">Películas</div>
                    <button class="add-section-button" onclick="openTmdbModal('movie')">Agregar Película</button>
                    <div class="content-section">
                        ${
                            (movieList.length === 0)
                            ? `<span class="no-content-message">Sin películas</span>`
                            : movieList.map(item => contentCardHTML(item)).join('')
                        }
                    </div>
                `;
            } else if (type === 'series') {
                const seriesList = contentData.filter(item => item.type === 'series');
                html += `<div class="section-header">Series</div>
                         <button class="add-section-button" onclick="openTmdbModal('series')">Agregar Serie</button>
                         <div class="content-section">
                         ${
                            (seriesList.length === 0)
                            ? `<span class="no-content-message">Sin series</span>`
                            : seriesList.map(item => contentCardHTML(item)).join('')
                         }
                         </div>
                `;
            } else if (type === 'movie') {
                const movieList = contentData.filter(item => item.type === 'movie');
                html += `<div class="section-header">Películas</div>
                         <button class="add-section-button" onclick="openTmdbModal('movie')">Agregar Película</button>
                         <div class="content-section">
                         ${
                            (movieList.length === 0)
                            ? `<span class="no-content-message">Sin películas</span>`
                            : movieList.map(item => contentCardHTML(item)).join('')
                         }
                         </div>
                `;
            } else if (type === 'config') {
                html = `
                    <div class="config-section">
                        <h2>Configuración</h2>
                        <div class="config-group">
                            <label for="config-tmdb-api-key" class="config-label">Clave API de TMDB:</label>
                            <input type="text" id="config-tmdb-api-key" class="config-input" value="${escapeHTML(config.tmdbApiKey || '')}" placeholder="Ingresa tu clave API de TMDB">
                        </div>
                        <button class="config-save-button" onclick="saveConfig()">Guardar Configuración</button>
                    </div>
                `;
            }


            panel.innerHTML = html;
            // Setup event delegation for card clicks after panel content is set
             setupPanelCardClickListeners();
            // Setup event delegation for options buttons after panel content is set
            setupPanelOptionsListeners();


            // Ensure enrichment runs after DOM is updated
            if (type !== 'config') {
                enrichCardDetails();
            }

        }

        // Setup event delegation for card clicks on the panel
        function setupPanelCardClickListeners() {
             const panel = document.getElementById('content-panel');
             // Remove previous delegation listener if it exists
             if (panel._cardClickListener) {
                  panel.removeEventListener('click', panel._cardClickListener);
             }

             const cardClickListener = function(event) {
                 const card = event.target.closest('.content-card');
                 // Check that the click target is not the options button or within the options menu
                 const optionsButton = event.target.closest('.content-options-btn');
                 const optionsMenu = event.target.closest('.content-options-menu');

                 if (card && !optionsButton && !optionsMenu) {
                     const cardId = card.getAttribute('data-cardid');
                     openPlayerModal(cardId);
                 }
             };
             panel.addEventListener('click', cardClickListener);
             panel._cardClickListener = cardClickListener; // Store reference to remove later
        }


        // BOTÓN OPCIONES / menú en cada carta (tres puntos, mostrar opciones)
        // Using event delegation on the panel for options buttons
        function setupPanelOptionsListeners() {
             const panel = document.getElementById('content-panel');
              // Remove previous delegation listener if it exists
             if (panel._optionsListener) {
                  panel.removeEventListener('click', panel._optionsListener);
             }

             const optionsListener = function(event) {
                 const optionsButton = event.target.closest('.content-options-btn');
                 if (optionsButton) {
                      event.stopPropagation(); // Prevent card click if clicked on options button
                      const id = optionsButton.getAttribute('data-cardid');
                      toggleCardOptionsMenu(id); // toggleCardOptionsMenu will handle closing others
                 }
             };
             panel.addEventListener('click', optionsListener);
             panel._optionsListener = optionsListener; // Store reference
        }

        // Manejo visual del desplegable de opciones
        function toggleCardOptionsMenu(cardId) {
            // Close the currently open menu if any, unless it's the one we are opening
            if (openOptionsMenuId && openOptionsMenuId !== cardId) {
                 closeAllOptionsMenus();
            }

            const menu = document.getElementById('optionsmenu_' + cardId);
            if (menu) {
                const isOpen = menu.classList.contains('open');
                closeAllOptionsMenus(); // Close all menus first
                if (!isOpen) {
                    menu.classList.add('open');
                    openOptionsMenuId = cardId;
                     // Ensure click within the menu doesn't close it via body listener
                    // menu.onclick = e => e.stopPropagation(); // This is already handled by the general click listener now
                } else {
                    openOptionsMenuId = null; // The menu was already open and is now closed by closeAllOptionsMenus
                }
            }
        }
        function closeAllOptionsMenus() {
            document.querySelectorAll('.content-options-menu.open').forEach(menu => menu.classList.remove('open'));
            openOptionsMenuId = null;
        }

        // ---- MODALES ----

        // TMDB Search Modal
        function openTmdbModal(sectionType) {
            tmdbModalSection = sectionType; // 'series' o 'movie'

        // Helper to prevent XSS in input values
        function escapeHTML(str) {
             if (str === undefined || str === null) return '';
            return String(str) // Ensure it's treated as a string
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
            document.body.style.overflow = '';

        function saveEditModal(cardId) {
            let item = contentData.find(e=>e.id===cardId);
            if (!item) return;
            let newTitle = document.getElementById('edit-title').value.trim();
            let newYear = document.getElementById('edit-year').value.trim();
            let newOverview = document.getElementById('edit-overview').value.trim();
            let newRating = document.getElementById('edit-rating').value.trim();
            let newPosterUrl = document.getElementById('edit-poster-url').value.trim();
             let newBackdropUrl = document.getElementById('edit-backdrop-url').value.trim();
            let newTrailerId = document.getElementById('edit-trailer-id').value.trim();


            if (!newTitle) {
                alert('El título no puede estar vacío.');
                return;
            }
            if (newYear && (!/^\d{4}$/.test(newYear))) {
                alert('El año debe tener 4 dígitos o estar vacío.');
                return;
            }
             if (newRating && (!/^[0-9]*(\.[0-9]+)?$/.test(newRating) || parseFloat(newRating) > 10)) {
                 // Allow empty string, numbers with optional decimal part, not greater than 10
                 if (newRating !== '' && (parseFloat(newRating) < 0 || parseFloat(newRating) > 10)) {
                    alert('La clasificación debe ser un número entre 0 y 10 (ej: 7.5) o estar vacío.');
                     return;
                 }
                 if (newRating !== '' && !/^[0-9]*(\.[0-9]+)?$/.test(newRating)) {
                      alert('Formato de clasificación inválido. Usa solo números y un punto (ej: 7.5).');
                      return;
                 }
            }


            item.title = newTitle;
            item.year = newYear || undefined;
            item.overview = newOverview || undefined;
            item.rating = newRating || undefined;
            item.poster_url = newPosterUrl || undefined;
            item.backdrop_url = newBackdropUrl || undefined; // Save backdrop URL
            item.trailer_id = newTrailerId || undefined;


             // Mark as manually edited for these fields by setting them explicitly.
             // We can also mark the item as "_extraLoaded" to prevent TMDB enrichment from overwriting *any* field
             // unless the saved value was explicitly `undefined`. The current structure handles this.
             // Let's ensure that if a field is set here (even to empty string converted to undefined),
             // the enricher doesn't touch it. The check `item.overview === undefined` already does this.
            item._extraLoaded = true; // Assume if edited manually, we don't need TMDB enrichment for this item anymore


            saveData(); // Save updated contentData
            closeEditModal();
            showContent(lastPanelMode); // Re-render the panel to show updated info
        }

        // Buscar en TMDB API: series o peliculas según modo
        async function tmdbSearch() {
            const input = document.getElementById('tmdb-searchinput').value.trim();
            const resultList = document.getElementById('tmdb-resultlist');
            const noResult = document.getElementById('tmdb-noresult');

             const apiKey = config.tmdbApiKey;
             if (!apiKey || apiKey === DEFAULT_TMDB_API_KEY) {
                  // Check if apiKey is empty or just the default one
                  if (!apiKey) {
                     resultList.innerHTML = "";
                     noResult.textContent = "Clave API de TMDB no configurada.";
                     noResult.style.display = "block";
                     return;
                  }
                  console.warn("Using default TMDB API key for search.");
             }


            resultList.innerHTML = "";
            noResult.style.display = "none";
            if (!input) {
                noResult.textContent = "Ingresa el nombre de " + (tmdbModalSection === 'series' ? "una serie." : "una película.");
                noResult.style.display = "block";
                return;
            }
            resultList.innerHTML = `<li class='tmdb-search-result' style="justify-content:center;text-align:center;color:#bbb;">Buscando...</li>`;
            let url, resultKind;
            if (tmdbModalSection === "series") {
                url = `https://api.themoviedb.org/3/search/tv?api_key=${apiKey}&language=es-ES&query=${encodeURIComponent(input)}`;
                resultKind = "tv";
            } else {
                url = `https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&language=es-ES&query=${encodeURIComponent(input)}`;
                resultKind = "movie";
            }
            try {
                let response = await fetch(url);
                if (!response.ok) {
                     console.error(`TMDB search error: ${response.status}`, await response.text());
                     // Check for specific API key invalid error (status 401)
                     if (response.status === 401) {
                         resultList.innerHTML = "";
                         noResult.textContent = "Clave API de TMDB inválida. Revisa la Configuración.";
                         noResult.style.display = "block";
                         return;
                     }
                     throw new Error(`HTTP error! status: ${response.status}`);
                 }
                let data = await response.json();

                if (!data.results || data.results.length === 0) {
                    resultList.innerHTML = "";
                    noResult.textContent = "No encontrado.";
                    noResult.style.display = "block";
                    return;
                }
                // Show top 12 results
                resultList.innerHTML = data.results.slice(0, 12).map((item) => {
                    let id = item.id;
                    let title = tmdbModalSection === 'series' ? (item.name || "") : (item.title || "");
                    let date = (tmdbModalSection === 'series' ? item.first_air_date : item.release_date) || "";
                    let year = date ? date.substring(0,4) : "";
                    let posterPath = item.poster_path ? (TMDB_IMAGE_URL + item.poster_path) : "";
                    // Check if item with this tmdb_id AND type already exists in contentData
                    let alreadyAdded = contentData.some(cd =>
                        (cd.tmdb_id && String(cd.tmdb_id) === String(id)) // Ensure comparison is robust
                        && (cd.type === (tmdbModalSection === "series" ? "series" : "movie"))
                    );
                    let disabled = alreadyAdded ? "disabled" : "";
                    let btnText = alreadyAdded ? "Agregada" : ("Agregar " + (tmdbModalSection === "series" ? "Serie" : "Película"));

                    // Pass item as string, escape single quotes within the JSON string using HTML entity
                    const escapedItemJson = JSON.stringify(item)
                                               .replace(/'/g, "&#039;");


                    return `
                      <li class="tmdb-search-result">
                        ${posterPath ? `<img class="tmdb-search-result-image" src="${escapeHTML(posterPath)}" alt="">` : `<div class="tmdb-search-result-image"></div>`}
                        <div class="tmdb-search-info-block">
                          <span class="tmdb-search-info-title">${escapeHTML(title)}</span>
                          ${year ? `<span class="tmdb-search-info-date">(${escapeHTML(year)})</span>` : ""}
                        </div>
                        <button class="tmdb-search-addbtn"
                            ${disabled}
                            onclick='addTmdbFoundItem(${escapedItemJson}, "${tmdbModalSection}")'>${btnText}</button>
                      </li>
                    `;
                }).join('');
            } catch (e) {
                console.error("Error searching TMDB:", e);
                resultList.innerHTML = "";
                noResult.textContent = "Error buscando. Verifica la clave API en Configuración.";
                noResult.style.display = "block";
            }
        }

        // Agrega serie o película seleccionada
        function addTmdbFoundItem(tmdbItem, tipo) {
            let id = tmdbItem.id;
             // Check if item already exists
            if (contentData.some(cd => isSameItem(cd, tmdbItem.id, tipo))) {
                return;
             }
             // Generate a simpler, stable short code for the item
             const shortCode = generateShortCode();
             const itemObj = {
                 id: shortCode, // New, stable short, human-readable code
                 tmdb_id: tmdbItem.id, // keep TMDB ID for reference
                 type: tipo === "series" ? "series" : "movie",
                 poster_url: tmdbItem.poster_path ? TMDB_IMAGE_URL + tmdbItem.poster_path : undefined,
                 backdrop_url: tmdbItem.backdrop_path ? TMDB_BACKDROP_URL + tmdbItem.backdrop_path : undefined,
                 year: (tipo === "series"
                     ? (tmdbItem.first_air_date ? tmdbItem.first_air_date.substring(0,4) : undefined)
                     : (tmdbItem.release_date ? tmdbItem.release_date.substring(0,4) : undefined)
                 ),
                 servers: [], // Initialize servers as an empty array of objects
                 // Keep these undefined initially so enrichCardDetails fetches them from TMDB details
                 overview: undefined,
                 rating: undefined,
                 genres: undefined,
                 trailer_id: undefined, // Will be fetched by enrichCardDetails
                 runtime: undefined, // Will be fetched by enrichCardDetails
                 language: undefined, // Will be fetched by enrichCardDetails (original/spoken)
                 countries: undefined, // Will be fetched by enrichCardDetails (production countries)

                 _extraLoaded: false // Mark as not yet enriched
             };
             contentData.push(itemObj);

             saveData(); // Save newly added item

             // Refresh the TMDB search results to disable the added item button
             tmdbSearch();

             // Refresh the main panel view
             showContent(lastPanelMode); // This will also trigger enrichCardDetails for the new item
        }

        // Helper to generate a short, readable code like 'AB123'
        function generateShortCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ'.split('');
            let code;
            do {
                code = '';
                // First 2 characters are letters
                for (let i = 0; i < 2; i++) {
                    code += chars[Math.floor(Math.random() * chars.length)];
                }
                // Then 3 numbers
                for (let i = 0; i < 3; i++) {
                    code += Math.floor(Math.random() * 10);
                }
            } while (contentData.some(item => item.id === code)); // Ensure code is unique
            return code;
        }

        // Helper to check if item with same TMDB id and type exists
        function isSameItem(item, tmdbId, type) {
            return String(item.tmdb_id) === String(tmdbId) && item.type === (type === "series" ? "series" : "movie");
        }

        function deleteContent(cardId) {
            if (!confirm("¿Seguro que deseas eliminar?")) return;
            let idx = contentData.findIndex(e=>e.id===cardId);
            if (idx !== -1) {

                saveData(); // Save after deletion
                showContent(lastPanelMode); // Re-render the current view
                closeAllOptionsMenus();
            }
        }

        // Permite buscar con Enter o click en botón (TMDB Modal)
        function tmdbSetupEvents() {
            const searchInput = document.getElementById('tmdb-searchinput');
            const searchBtn = document.getElementById('tmdb-search-btn');

            // Add listeners only once if they don't exist
             if (searchInput && !searchInput._hasListeners) {
                 searchInput.addEventListener('keydown', function(e){
                    if (e.key === 'Enter') tmdbSearch();
                 });
                 searchInput._hasListeners = true; // Mark as having listeners
             }

             if (searchBtn && !searchBtn._hasListeners) {
                 searchBtn.addEventListener('click', tmdbSearch);
                 searchBtn._hasListeners = true; // Mark as having listeners
             }
        }

        // ---- PLAYER MODAL LOGIC ----
        let currentPlayingItemId = null; // Track which item is currently in the player modal

        async function openPlayerModal(cardId) {
             closeAllOptionsMenus(); // Close options menu first

             const item = contentData.find(e => e.id === cardId);
             if (!item) return;

             currentPlayingItemId = cardId; // Set the currently playing item ID

             const modal = document.getElementById('player-modal');

             const serverButtonsContainer = document.getElementById('player-server-buttons-container');
             const noServersMessageElem = serverButtonsContainer.querySelector('#no-servers-message');
             const shareBtn = document.getElementById('player-share-btn');


             // Reset/clear previous content
             titleEl.textContent = item.title || 'Sin título';
             posterEl.src = item.poster_url || '';
             posterEl.alt = item.title || '';
             header.style.setProperty('--bg-image', `url('${escapeHTML(item.backdrop_url || item.poster_url || '')}')`); // Use backdrop or poster as background

             overviewEl.textContent = item.overview !== undefined ? item.overview : (item.tmdb_id ? 'Cargando sinopsis...' : 'Sin sinopsis');
             ratingEl.textContent = item.rating !== undefined ? (item.rating ? `★ ${item.rating}` : '') : (item.tmdb_id ? 'Cargando...' : ''); // Handle rating display
             yearEl.textContent = item.year || '';
             genresEl.textContent = item.genres || '';
             runtimeEl.textContent = ''; runtimeLiEl.style.display = 'none';
             languageEl.textContent = ''; languageLiEl.style.display = 'none';
             moreDataEl.innerHTML = ''; // Clear extra tags
             trailerBtn.style.display = 'none'; // Hide trailer button initially

             // Attempt to enrich details if not already loaded
             if (item.tmdb_id && !item._extraLoaded) {
                  const details = await fetchTmdbDetails(item.tmdb_id, item.type);
                  if (details) {
                      // Update UI fields with fetched data if they are still showing placeholders or were undefined
                      if (item.overview === undefined && details.overview !== undefined) overviewEl.textContent = details.overview;
                      if (item.rating === undefined && details.vote_average !== undefined) ratingEl.textContent = details.vote_average ? details.vote_average.toFixed(1) : '';
                      if (item.year === undefined && (item.type === 'series' ? details.first_air_date : details.release_date)) yearEl.textContent = (item.type === 'series' ? details.first_air_date : details.release_date).substring(0, 4);
                      if (item.genres === undefined && details.genres !== undefined) genresEl.textContent = (details.genres && details.genres.map(g=>g.name).join(", ")) || "";
                      if (item.poster_url === undefined && details.poster_path) posterEl.src = TMDB_IMAGE_URL + details.poster_path;
                      if (item.backdrop_url === undefined && details.backdrop_path) header.style.setProperty('--bg-image', `url('${TMDB_BACKDROP_URL + details.backdrop_path}')`);

                       // Update item data object with fetched details if they were undefined
                       if (item.overview === undefined && details.overview !== undefined) item.overview = details.overview;
                       if (item.rating === undefined && details.vote_average !== undefined) item.rating = details.vote_average ? details.vote_average.toFixed(1) : '';
                       if (item.year === undefined && (item.type === 'series' ? details.first_air_date : details.release_date)) item.year = (item.type === 'series' ? details.first_air_date : details.release_date).substring(0, 4);
                       if (item.genres === undefined && details.genres !== undefined) item.genres = (details.genres && details.genres.map(g=>g.name).join(", ")) || "";
                       if (item.poster_url === undefined && details.poster_path) item.poster_url = TMDB_IMAGE_URL + details.poster_path;
                       if (item.backdrop_url === undefined && details.backdrop_path) item.backdrop_url = TMDB_BACKDROP_URL + details.backdrop_path;

                       // Runtime

                     const activeBtn = document.querySelector('#player-server-buttons-container .servidor-btn.active');

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');

            const toast = document.createElement('div');
            toast.className = 'toast-message';
            if (type === 'error') {
                toast.classList.add('error');
            }
            toast.textContent = message;
            container.appendChild(toast);

            // Show the toast
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);

            // Hide and remove the toast after a few seconds
            setTimeout(() => {
                toast.classList.remove('show');
                toast.addEventListener('transitionend', () => {
                    toast.remove();
                }, { once: true });
            }, 3000);

                code = hash.substring(1);

                    console.warn(`Deep link item with ID "${code}" not found.`);

                        <ul>
                            ${ratingText !== 'N/A' ? `<li><i class="fas fa-star"></i> ${ratingText}</li>` : ''}
                            ${runtimeText ? `<li><i class="fas fa-clock"></i> ${runtimeText}</li>` : ''}
                            ${year ? `<li><i class="fas fa-calendar-alt"></i> ${year}</li>` : ''}
                            ${language ? `<li><i class="fas fa-closed-captioning"></i> ${language}</li>` : ''}
                        </ul>
                        <p class="resume">${overview}</p>
                        <div class="more-data">
                            ${genres ? `<p><i class="fas fa-film"></i> ${genres}</p>` : ''}
                            ${countries ? `<p><i class="fas fa-globe"></i> ${countries}</p>` : ''}
                        </div>
                    </div>
                </div>

                ${serversAvailable ? `
                <div class="player-section">
                     <div class="reproductor-container">
                        ${playerContainersHtml}
                    </div>
                    <div class="servidores-container">
                        <h4 style="color: var(--primary-color); margin-bottom: 15px;"><i class="fas fa-server"></i> Servidores disponibles:</h4>
                        ${serverButtonsHtml}
                    </div>
                </div>
                ` : `
                <div style="text-align:center; padding: 40px; color: #bbb;">
                    <h2>No hay servidores disponibles para este contenido.</h2>
                </div>
                `}

                <script>
                    const videoServers = ${serversJson};
                    let jwPlayerInstances = {};

                    function cambiarServidor(serverIndex, clickedButton) {
                        // Stop all players
                        Object.values(jwPlayerInstances).forEach(player => { if (player) player.stop(); });
                        document.querySelectorAll('.player-container iframe').forEach(frame => { if (frame.src) frame.src = ''; });
                        // Hide all player containers
                        document.querySelectorAll('.player-container').forEach(c => c.classList.add('hidden'));
                        
                        const server = videoServers[serverIndex];
                        if (!server) return;

                        const container = document.querySelector('.player-container[data-player-index="' + serverIndex + '"]');
                        if (!container) return;
                        
                        container.classList.remove('hidden');

                        if (server.type === 'direct') {
                            initJWPlayer(serverIndex, server.url);
                        } else {
                            const iframe = container.querySelector('iframe');
                            if(iframe && iframe.src !== server.url) {
                                 iframe.src = server.url;
                            }
                        }

                        // Update active button style
                        document.querySelectorAll('.servidor-btn').forEach(btn => btn.classList.remove('active'));
                        if (clickedButton) clickedButton.classList.add('active');
                    }

                    function initJWPlayer(index, url) {
                        const containerId = 'jwplayer-container-' + index;
                        if (jwPlayerInstances[index] && jwPlayerInstances[index].getState() !== 'destroyed') {
                            jwPlayerInstances[index].load([{ file: url, label: "HD" }]);
                            jwPlayerInstances[index].play();
                        } else {
                            jwPlayerInstances[index] = jwplayer(containerId).setup({
                                sources: [{ file: url, label: "HD" }],
                                aspectratio: "16:9", width: "100%", height: "100%", autostart: true, skin: { name: "bekle" }
                            });
                            jwPlayerInstances[index].on('error', function() {
                                alert('Error al cargar este video. Intenta con otro servidor.');
                                const activeBtn = document.querySelector('.servidor-btn.active');
                                const nextBtn = activeBtn ? activeBtn.nextElementSibling : null;
                                if(nextBtn && nextBtn.classList.contains('servidor-btn')) {
                                    nextBtn.click();
                                }
                            });
                        }
                    }

                    // On page load, if there are servers, initialize the first one.
                    document.addEventListener('DOMContentLoaded', () => {
                        if (videoServers.length > 0) {
                            const firstServer = videoServers[0];
                            if (firstServer.type === 'direct') {
                                initJWPlayer(0, firstServer.url);
                            }
                        }
                    });
                <\/script>
            </body>
            </html>`;

            document.documentElement.innerHTML = newHtml;
        }

    </script>
